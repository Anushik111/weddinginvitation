<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Արամ և Արմինա | Հարսանեկան հրավիրատոմս</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Armenian:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #fbf7f0;
  --green: #536b50;
  --dark: #353d31;
  --gold: #b59a6a;
  --pink: #e8d4cc;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--dark);
  background: var(--cream);
  font-family: "Noto Serif Armenian", serif;
}

button, input, select, textarea { font: inherit; }

button, a { -webkit-tap-highlight-color: transparent; }

.cover {
  min-height: 100svh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px 18px;
  overflow: hidden;
  background:
    linear-gradient(#f9f3e9a8, #f9f3e9b8),
    url("https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1600&q=85")
    center/cover;
}

.cover::before,
.cover::after {
  content: "❀";
  position: absolute;
  color: #84977a;
  opacity: .45;
  font-size: clamp(100px, 20vw, 230px);
  pointer-events: none;
}

.cover::before {
  top: -35px;
  left: -30px;
  transform: rotate(-30deg);
}

.cover::after {
  bottom: -55px;
  right: -25px;
  transform: rotate(25deg);
}

.cover-card {
  width: min(100%, 510px);
  padding: 28px 22px 35px;
  text-align: center;
  border: 1px solid #b8a47b;
  outline: 1px solid #b8a47b;
  outline-offset: 6px;
  background: #fbf7f0ed;
  position: relative;
  z-index: 1;
}

.eyebrow {
  color: var(--green);
  font-size: 12px;
  letter-spacing: 3px;
  line-height: 2;
}

.cover-photo {
  width: 100%;
  height: 300px;
  display: block;
  object-fit: cover;
  margin: 22px auto;
  background: #e6ddd0;
}

.names {
  margin: 16px 0 10px;
  color: var(--green);
  font-weight: 400;
  font-size: clamp(31px, 7vw, 49px);
  line-height: 1.5;
}

.ampersand {
  color: var(--gold);
  font-family: "Playfair Display", serif;
  font-style: italic;
}

.cover-date {
  color: #766c5a;
  letter-spacing: 4px;
  font-size: 15px;
  margin: 15px 0 26px;
}

.primary-button,
.map-button,
.submit-button {
  border: 1px solid var(--green);
  background: var(--green);
  color: white;
  text-decoration: none;
  padding: 13px 23px;
  cursor: pointer;
  display: inline-block;
  transition: .25s ease;
}

.primary-button:hover,
.map-button:hover,
.submit-button:hover {
  background: #3e533c;
}

.invitation {
  display: none;
  animation: appear .8s ease both;
}

.invitation.visible { display: block; }

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero {
  text-align: center;
  padding: 70px 20px 55px;
  background:
    linear-gradient(#fbf7f0e8, #fbf7f0f2),
    url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1600&q=85")
    center/cover;
}

.hero h2 {
  font-size: clamp(29px, 6vw, 44px);
  color: var(--green);
  font-weight: 400;
  margin: 14px 0;
}

.hero p {
  line-height: 2;
  font-size: 15px;
}

.section {
  width: min(100% - 32px, 900px);
  margin: auto;
  padding: 55px 0;
}

.section-title {
  text-align: center;
  font-weight: 400;
  font-size: 27px;
  color: var(--green);
  margin: 0 0 12px;
}

.section-subtitle {
  text-align: center;
  color: #857c6a;
  font-size: 14px;
  line-height: 2;
  margin: 0 auto 30px;
}

.events {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.event {
  text-align: center;
  border: 1px solid #ded4c2;
  padding: 18px 14px 23px;
  background: #fffdf9;
}

.event-number {
  color: var(--gold);
  font-family: "Playfair Display", serif;
  font-size: 27px;
  margin-bottom: 8px;
}

.event h3 {
  font-weight: 500;
  font-size: 17px;
  color: var(--green);
  margin: 8px 0;
}

.event-time {
  font-size: 15px;
  margin: 8px 0 18px;
}

.place-photo {
  display: block;
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 3px;
  margin: 12px 0 17px;
  background: #e7dfd3;
}

.map-button {
  padding: 10px 13px;
  font-size: 13px;
}

.quote {
  background: #edf0e7;
  padding: 44px 22px;
  text-align: center;
  color: var(--green);
  line-height: 2.1;
  font-size: 17px;
}

.rsvp {
  background: #f1e9dc;
  padding: 50px 20px;
}

.rsvp-inner {
  width: min(100%, 570px);
  margin: auto;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 15px;
  font-size: 13px;
}

.field.full { grid-column: 1 / -1; }

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d5c9b7;
  background: #fffdf9;
  color: var(--dark);
  border-radius: 0;
  outline-color: var(--green);
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.submit-button {
  width: 100%;
  margin-top: 7px;
}

.note {
  font-size: 12px;
  color: #766c5a;
  line-height: 1.8;
  text-align: center;
  margin-top: 14px;
}

footer {
  text-align: center;
  padding: 30px 16px;
  color: var(--green);
  line-height: 2;
}

.footer-names {
  font-family: "Playfair Display", serif;
  font-size: 25px;
}

.couple-section {
  background: #f1e9dc;
  padding: 42px 20px;
  text-align: center;
}

.couple-frame {
  width: min(100%, 650px);
  margin: 24px auto 0;
  padding: 10px;
  background: #fffdf9;
  border: 1px solid #b59a6a;
}

.couple-main-photo {
  display: block;
  width: 100%;
  height: 420px;
  object-fit: cover;
  background: #e6ddd0;
}

.couple-caption {
  color: var(--green);
  padding: 14px 8px 5px;
  font-size: 14px;
  line-height: 1.9;
}

.music-button {
  display: none;
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 30;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: var(--green);
  color: white;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 4px 14px #0002;
}

.music-button.show { display: block; }

.music-button.playing {
  animation: musicSpin 5s linear infinite;
}

@keyframes musicSpin {
  to { transform: rotate(360deg); }
}

@media (max-width: 700px) {
  .events { grid-template-columns: 1fr; }
  .event { padding: 20px; }
  .place-photo { height: 240px; }
  .cover-photo { height: 250px; }
  .form-grid { grid-template-columns: 1fr; gap: 0; }
  .field.full { grid-column: auto; }
  .section { padding: 40px 0; }
  .couple-main-photo { height: 340px; }
}
</style>
</head>

<body>

<!-- ԱՌԱՋԻՆ ԷՋ -->
<section class="cover" id="cover">
  <div class="cover-card">
    <div class="eyebrow">ՍԻՐՈՒՄ ԵՆՔ ԵՎ ՀՐԱՎԻ
